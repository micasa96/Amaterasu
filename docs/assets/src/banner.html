<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Amaterasu banner</title>
<!--
  Source for the README banner and the GitHub social preview.
  Render with: python docs/assets/src/render.py

  Concept: the Blackflare mark as a large white flame with real volume,
  its silhouette echoing outward as heat lines, under the app canvas's
  light beam. No panels, no glow, no version number.
-->
<style>
  @font-face {
    font-family: "Mona Sans Variable";
    src: url("../../../web/ui/node_modules/@fontsource-variable/mona-sans/files/mona-sans-latin-wght-normal.woff2") format("woff2");
    font-weight: 200 900;
  }

  /* Dark-side values of web/ui/src/styles/tokens.css */
  :root {
    --ground: oklch(0.118 0 0);
    --text: oklch(0.97 0 0);
    --text-secondary: oklch(0.83 0 0);
    --text-muted: oklch(0.72 0 0);
    --sheen: oklch(1 0 0 / 0.1);
    --primary-fill: linear-gradient(180deg, oklch(1 0 0) 0%, oklch(0.97 0 0) 100%);
    --button-text: oklch(0.12 0 0);
  }

  * { box-sizing: border-box; margin: 0; }

  html, body {
    background: transparent;
    font-family: "Mona Sans Variable", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text);
  }

  /* Banner: 1600x600 (rendered @2x), rounded. Social: 1280x640, square. */
  .frame {
    position: relative;
    width: var(--w);
    height: var(--h);
    overflow: hidden;
    isolation: isolate;
    background: var(--ground);
    border-radius: var(--r);
    display: flex;
    align-items: center;
    padding-left: var(--pad);
  }

  body.banner { --w: 1600px; --h: 600px; --r: 28px; --pad: 104px; }
  body.social { --w: 1280px; --h: 640px; --r: 0px; --pad: 76px; }

  /* Edge light around the whole frame (banner only). */
  body.banner .frame::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 5;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(180deg, oklch(1 0 0 / 0.16), oklch(1 0 0 / 0.04) 60%, oklch(1 0 0 / 0.08));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* The app canvas's diagonal beam, faint, falling toward the eclipse. */
  .beam {
    position: absolute;
    inset: 0;
    z-index: 0;
    background:
      linear-gradient(112deg, transparent 34%, var(--sheen) 46%, transparent 58%),
      radial-gradient(40rem 18rem at 10% 120%, oklch(1 0 0 / 0.04), transparent 70%);
  }

  /* ── The eclipse ─────────────────────────────────────────────── */
  .eclipse {
    position: absolute;
    z-index: 1;
    top: 50%;
    left: var(--ex);
    width: var(--es);
    height: var(--es);
    transform: translate(-50%, -50%);
  }
  body.banner .eclipse { --ex: 1230px; --es: 540px; }
  body.social .eclipse { --ex: 990px; --es: 500px; }

  /* The white flame: pearl white with a highlight band and shaded inner
     edges, a grounded shadow, and heat lines spreading out around it. */
  .flame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 40px 60px oklch(0 0 0 / 0.7));
  }
  .flame .body { fill: url(#fill); }
  .flame .echoes use { vector-effect: non-scaling-stroke; }

  /* ── Identity ─────────────────────────────────────────────────── */
  .identity {
    position: relative;
    z-index: 3;
    display: grid;
    gap: 28px;
  }

  .lockup { display: flex; align-items: center; gap: 28px; }
  body.social .lockup { gap: 22px; }

  .mark {
    flex-shrink: 0;
    display: grid;
    place-items: center;
    width: var(--mark);
    height: var(--mark);
    border-radius: 28%;
    background: var(--primary-fill);
    color: var(--button-text);
    box-shadow:
      inset 0 1px 0 oklch(1 0 0 / 0.5),
      0 18px 48px -14px oklch(1 0 0 / 0.28),
      0 2px 6px oklch(0 0 0 / 0.5);
  }
  .mark svg { width: 72%; height: 72%; }
  body.banner .mark { --mark: 104px; }
  body.social .mark { --mark: 84px; }

  .wordmark {
    font-weight: 520;
    letter-spacing: -0.04em;
    line-height: 0.95;
  }
  body.banner .wordmark { font-size: 112px; }
  body.social .wordmark { font-size: 88px; }

  .tagline {
    color: var(--text-secondary);
    font-weight: 440;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  body.banner .tagline { font-size: 38px; }
  body.social .tagline { font-size: 34px; }

  .lede {
    max-width: 26ch;
    color: var(--text-muted);
    font-size: 23px;
    line-height: 1.45;
    font-weight: 440;
  }
  body.banner .lede { display: none; }

  .pills { display: flex; flex-wrap: wrap; gap: 12px; }
  .pill {
    display: inline-flex;
    align-items: center;
    height: 40px;
    padding: 0 18px;
    border-radius: 999px;
    background: oklch(0.22 0 0 / 0.85);
    box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.06);
    color: var(--text-secondary);
    font-size: 19px;
    font-weight: 580;
  }
  body.social .pill { height: 38px; font-size: 18px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="beam"></div>

    <div class="eclipse" aria-hidden="true">
      <svg class="flame" viewBox="0 0 256 256">
        <defs>
          <!-- The outer silhouette only (no inner flame or stem notch), for the heat lines. -->
          <path id="hull" d="M144 20 C144 80 220 92 220 158 C220 192 198 220 168 232 L150 236 C86 246 36 206 36 150 C36 122 52 102 76 82 C76 110 90 122 106 112 C128 94 116 56 144 20 Z" />
          <path id="f" d="M144 20 C144 80 220 92 220 158 C220 192 198 220 168 232 L142 202 C162 194 174 180 174 160 C174 138 152 126 138 108 C136 142 96 154 96 180 C96 198 110 208 126 208 L150 236 C86 246 36 206 36 150 C36 122 52 102 76 82 C76 110 90 122 106 112 C128 94 116 56 144 20 Z" />
          <!-- Pearl white: bright crown, a highlight band, cooler grey at the base. -->
          <linearGradient id="fill" x1="0.1" y1="0" x2="0.9" y2="1">
            <stop offset="0" stop-color="oklch(1 0 0)" />
            <stop offset="0.32" stop-color="oklch(0.955 0 0)" />
            <stop offset="0.46" stop-color="oklch(0.995 0 0)" />
            <stop offset="0.72" stop-color="oklch(0.88 0 0)" />
            <stop offset="1" stop-color="oklch(0.74 0 0)" />
          </linearGradient>
          <!-- Volume: shade just inside the silhouette so the flame reads as a solid. -->
          <filter id="volume" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="soft" />
            <feComposite in="SourceAlpha" in2="soft" operator="out" result="rim" />
            <feFlood flood-color="#000" flood-opacity="0.32" />
            <feComposite in2="rim" operator="in" result="shade" />
            <feOffset in="SourceAlpha" dx="-0.6" dy="1" result="up" />
            <feComposite in="SourceAlpha" in2="up" operator="out" result="lipHard" />
            <feGaussianBlur in="lipHard" stdDeviation="0.35" result="lip" />
            <feFlood flood-color="#fff" flood-opacity="0.75" />
            <feComposite in2="lip" operator="in" result="lit" />
            <feMerge>
              <feMergeNode in="SourceGraphic" />
              <feMergeNode in="shade" />
              <feMergeNode in="lit" />
            </feMerge>
          </filter>
          <linearGradient id="rise" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" />
            <stop offset="0.62" stop-color="#fff" />
            <stop offset="0.92" stop-color="#fff" stop-opacity="0" />
          </linearGradient>
          <mask id="fadeLines" maskUnits="userSpaceOnUse" x="-300" y="-300" width="856" height="856">
            <rect x="-300" y="-300" width="856" height="856" fill="url(#rise)" />
          </mask>
        </defs>
        <!-- Heat lines: the silhouette repeated outward, fading as it spreads. -->
        <g class="echoes" mask="url(#fadeLines)" fill="none" stroke="#fff" stroke-width="1" vector-effect="non-scaling-stroke">
          <use href="#hull" transform="translate(130 176) scale(1.16) translate(-130 -176)" stroke-opacity="0.34" />
          <use href="#hull" transform="translate(130 176) scale(1.34) translate(-130 -176)" stroke-opacity="0.22" />
          <use href="#hull" transform="translate(130 176) scale(1.54) translate(-130 -176)" stroke-opacity="0.15" />
          <use href="#hull" transform="translate(130 176) scale(1.76) translate(-130 -176)" stroke-opacity="0.1" />
          <use href="#hull" transform="translate(130 176) scale(2.0) translate(-130 -176)" stroke-opacity="0.06" />
          <use href="#hull" transform="translate(130 176) scale(2.26) translate(-130 -176)" stroke-opacity="0.035" />
        </g>
        <use class="body" href="#f" filter="url(#volume)" />
      </svg>
    </div>

    <div class="identity">
      <div class="lockup">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M144 20 C144 80 220 92 220 158 C220 192 198 220 168 232 L142 202 C162 194 174 180 174 160 C174 138 152 126 138 108 C136 142 96 154 96 180 C96 198 110 208 126 208 L150 236 C86 246 36 206 36 150 C36 122 52 102 76 82 C76 110 90 122 106 112 C128 94 116 56 144 20 Z"/></svg>
        </span>
        <h1 class="wordmark">Amaterasu</h1>
      </div>
      <p class="tagline">Mirror. Manage. Deliver.</p>
      <p class="lede">Self-hosted Telegram mirroring with multi-engine downloads and media processing.</p>
      <div class="pills">
        <span class="pill">Self-hosted</span>
        <span class="pill">Docker</span>
        <span class="pill">Telegram</span>
      </div>
    </div>
  </div>
  <script>document.body.className = location.hash.slice(1) || "banner";</script>
</body>
</html>
